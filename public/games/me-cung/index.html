<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EDUVERSE - Mê Cung Tri Thức 2D (Bản HTML5 Độc Lập)</title>
  <meta name="description" content="Game mê cung 2D hiện đại phong cách arcade dẫn lối robot Vina giải mã tri thức và thu thập vật phẩm." />
  <style>
    /* ------------------------------------------------------------- */
    /* RESET & CORE TYPOGRAPHY                                       */
    /* ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #060b19;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .font-display {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      font-weight: 700;
    }
    .font-mono-numbers {
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090e1f; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes bounceGlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-shake { animation: shake 0.4s ease-in-out; }
    .animate-pulse { animation: pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .animate-bounce { animation: bounceGlow 1.2s ease-in-out infinite; }

    /* Layout Wrapper */
    #app-root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px;
      max-width: 1080px;
      margin: 0 auto;
    }
    @media (min-width: 640px) {
      #app-root { padding: 18px 24px; }
    }

    /* Common Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      text-decoration: none;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.98); }
    .btn-icon {
      padding: 8px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(51, 65, 85, 0.6);
      color: #94a3b8;
    }
    .btn-icon:hover {
      background: rgba(51, 65, 85, 0.9);
      color: #ffffff;
    }

    /* SVG utility icons */
    .icon {
      width: 16px;
      height: 16px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ------------------------------------------------------------- */
    /* START SCREEN                                                  */
    /* ------------------------------------------------------------- */
    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 8px;
      animation: fadeIn 0.3s ease-out;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(8, 51, 68, 0.8);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #67e8f9;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
      margin-bottom: 12px;
    }
    .hero-title {
      font-size: 32px;
      line-height: 1.15;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    @media (min-width: 640px) {
      .hero-title { font-size: 46px; }
    }
    .hero-desc {
      font-size: 14px;
      line-height: 1.5;
      color: #94a3b8;
      text-align: center;
      max-width: 580px;
      margin-bottom: 24px;
    }
    @media (min-width: 640px) {
      .hero-desc { font-size: 16px; }
    }

    /* Mascot Box */
    .mascot-container {
      position: relative;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mascot-box {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      background: #090e1f;
      border: 2px solid rgba(6, 182, 212, 0.4);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.3);
    }
    @media (min-width: 640px) {
      .mascot-box { width: 128px; height: 128px; }
    }
    .mascot-name {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      color: #67e8f9;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot-online {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #34d399;
      animation: pulseGlow 1.5s infinite;
    }

    /* Mode Selector Card */
    .mode-card {
      width: 100%;
      max-width: 600px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .mode-card-title {
      text-align: center;
      margin-bottom: 16px;
    }
    .mode-card-title .sub {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .mode-card-title .main {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 2px;
    }
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .mode-grid { grid-template-columns: 1fr 1fr; }
    }
    .mode-btn {
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: rgba(30, 41, 59, 0.5);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .mode-btn:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: #475569;
    }
    .mode-btn.active-5 {
      background: rgba(8, 51, 68, 0.7);
      border-color: #22d3ee;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
      outline: 1px solid #22d3ee;
    }
    .mode-btn.active-10 {
      background: rgba(69, 26, 3, 0.7);
      border-color: #fbbf24;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      outline: 1px solid #fbbf24;
    }
    .mode-btn-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .mode-count-cyan { font-size: 22px; font-weight: 900; color: #38bdf8; }
    .mode-count-amber { font-size: 22px; font-weight: 900; color: #fbbf24; }
    .mode-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
    }
    .tag-cyan { background: rgba(8, 51, 68, 0.6); color: #67e8f9; border-color: rgba(6, 182, 212, 0.4); }
    .tag-amber { background: rgba(69, 26, 3, 0.6); color: #fde68a; border-color: rgba(245, 158, 11, 0.4); }
    .mode-desc { font-size: 12px; color: #cbd5e1; line-height: 1.45; }

    /* Highlights 4-Grid */
    .highlights-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 28px;
      text-align: center;
    }
    @media (min-width: 640px) {
      .highlights-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .hl-box {
      padding: 12px 8px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hl-box .icon { width: 18px; height: 18px; margin-bottom: 4px; }
    .hl-box .hl-name { font-size: 12px; font-weight: 700; color: #ffffff; }
    .hl-box .hl-val { font-size: 11px; margin-top: 2px; }

    /* Big Start Button */
    .btn-start-game {
      padding: 16px 36px;
      border-radius: 18px;
      background: linear-gradient(135deg, #06b6d4, #2563eb 50%, #f59e0b);
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.4);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-start-game:hover {
      transform: scale(1.04);
      box-shadow: 0 0 45px rgba(6, 182, 212, 0.6);
    }
    .btn-start-game:active { transform: scale(0.96); }

    .highscore-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #fde68a;
      background: rgba(69, 26, 3, 0.4);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-top: 12px;
    }

    /* ------------------------------------------------------------- */
    /* GAME SCREEN & HUD                                             */
    /* ------------------------------------------------------------- */
    .game-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.25s ease-out;
      width: 100%;
    }
    .game-hud {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .hud-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-title h1 {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    .brand-title .tag {
      font-size: 9px;
      font-weight: 700;
      color: #22d3ee;
      background: rgba(8, 51, 68, 0.8);
      border: 1px solid rgba(6, 182, 212, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .brand-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }

    .hud-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .hud-stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid #1e293b;
      font-size: 12px;
      color: #cbd5e1;
    }
    .stat-score {
      border-color: rgba(245, 158, 11, 0.3);
      color: #fde68a;
    }
    .gate-badge-locked {
      background: rgba(69, 10, 10, 0.4);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-weight: 600;
    }
    .gate-badge-open {
      background: rgba(69, 26, 3, 0.4);
      border-color: rgba(245, 158, 11, 0.5);
      color: #fde68a;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Banners */
    .banner-celebration {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 12px auto;
      padding: 12px 16px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.25), rgba(251, 191, 36, 0.35), rgba(245, 158, 11, 0.25));
      border: 2px solid #fbbf24;
      color: #fef08a;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.5);
    }
    .banner-lock {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 12px auto;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(69, 10, 10, 0.85);
      border: 1px solid rgba(239, 68, 68, 0.6);
      color: #fca5a5;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* Canvas Viewport */
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 19 / 13;
      max-width: 1024px;
      margin: 0 auto;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(6, 182, 212, 0.3);
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.15);
      background-color: #060b19;
    }
    canvas#maze-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* Virtual Controls & D-Pad */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 0 6px 0;
      user-select: none;
    }
    .keyboard-hint {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    @media (min-width: 640px) {
      .keyboard-hint { display: flex; }
    }
    kbd {
      padding: 3px 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 11px;
      color: #38bdf8;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }

    /* Mobile D-Pad */
    .dpad-container {
      position: relative;
      width: 150px;
      height: 150px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #1e293b;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    @media (min-width: 768px) {
      .dpad-container { display: none; }
    }
    .dpad-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(71, 85, 105, 0.6);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .dpad-btn:active {
      background: #06b6d4;
      color: #ffffff;
      transform: scale(0.92);
    }
    .dpad-btn.up { top: 6px; left: 50%; transform: translateX(-50%); }
    .dpad-btn.down { bottom: 6px; left: 50%; transform: translateX(-50%); }
    .dpad-btn.left { left: 6px; top: 50%; transform: translateY(-50%); }
    .dpad-btn.right { right: 6px; top: 50%; transform: translateY(-50%); }
    .dpad-btn.up:active { transform: translateX(-50%) scale(0.92); }
    .dpad-btn.down:active { transform: translateX(-50%) scale(0.92); }
    .dpad-btn.left:active { transform: translateY(-50%) scale(0.92); }
    .dpad-btn.right:active { transform: translateY(-50%) scale(0.92); }
    .dpad-center {
      width: 30px;
      height: 30px;
      border-radius: 9999px;
      background: rgba(8, 51, 68, 0.6);
      border: 1px solid rgba(6, 182, 212, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-center-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #22d3ee;
      animation: pulseGlow 1.5s infinite;
    }

    /* ------------------------------------------------------------- */
    /* MODALS                                                        */
    /* ------------------------------------------------------------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: fadeIn 0.2s ease-out;
    }
    .modal-card {
      width: 100%;
      max-width: 580px;
      max-height: 92vh;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 20px;
      padding: 22px;
      position: relative;
      box-shadow: 0 0 50px rgba(6, 182, 212, 0.25);
    }
    @media (min-width: 640px) {
      .modal-card { padding: 28px; }
    }
    .modal-card.correct {
      border-color: rgba(16, 185, 129, 0.8);
      box-shadow: 0 0 60px rgba(16, 185, 129, 0.35);
    }
    .modal-card.incorrect {
      border-color: rgba(244, 63, 94, 0.8);
      box-shadow: 0 0 60px rgba(244, 63, 94, 0.35);
    }
    .modal-top-accent {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      background: linear-gradient(90deg, #06b6d4, #3b82f6, #f59e0b);
    }
    .modal-top-accent.correct {
      background: linear-gradient(90deg, #10b981, #14b8a6, #f59e0b);
    }
    .modal-top-accent.incorrect {
      background: linear-gradient(90deg, #f43f5e, #ef4444, #f97316);
    }

    /* Hero Banner Inside Modal */
    .hero-banner {
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: fadeIn 0.2s ease-out;
    }
    .hero-banner.correct {
      background: linear-gradient(90deg, rgba(6, 78, 59, 0.8), rgba(6, 95, 70, 0.4), #0f172a);
      border: 1px solid rgba(16, 185, 129, 0.6);
    }
    .hero-banner.incorrect {
      background: linear-gradient(90deg, rgba(76, 5, 25, 0.8), rgba(136, 19, 55, 0.4), #0f172a);
      border: 1px solid rgba(244, 63, 94, 0.6);
    }
    .hero-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hero-banner.correct .hero-icon-box {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #34d399;
    }
    .hero-banner.incorrect .hero-icon-box {
      background: rgba(244, 63, 94, 0.2);
      border: 1px solid rgba(244, 63, 94, 0.5);
      color: #fb7185;
    }

    /* Question Modal Details */
    .qm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .qm-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .qm-icon-tag {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #083344;
      border: 1px solid rgba(6, 182, 212, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #22d3ee;
      flex-shrink: 0;
    }
    .qm-subtag {
      font-size: 10px;
      font-weight: 700;
      color: #22d3ee;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .qm-subject {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }
    .qm-points-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fde68a;
      font-size: 12px;

        const data = await res.json();
        if (Array.isArray(data.questions) && data.questions.length > 0) {
          QUESTION_BANK = data.questions.map((q, i) => ({
            id: q.id || `q${i + 1}`,
            subject: q.skill_tags || 'KHTN',
            question: q.question_text,
            options: q.options,
            correctIndex: q.correct_index,
            explanation: q.explanation || '',
            points: 100,
            visualType: 'geometry',
          }));
        }
      } catch {}
    }

    function shuffleArray(arr) {
      const res = [...arr];
      for (let i = res.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [res[i], res[j]] = [res[j], res[i]];
      }
      return res;
    }

    function parseMapEntities(mode = 5) {
      const questionCheckpoints = [];
      const goldItems = [];
      let selectedCoords = [];
      if (mode === 5) {
        selectedCoords = [
          CANDIDATE_STATION_COORDS[0],
          CANDIDATE_STATION_COORDS[1],
          CANDIDATE_STATION_COORDS[3],
          CANDIDATE_STATION_COORDS[5],
          CANDIDATE_STATION_COORDS[7],
        ];
      } else {
        selectedCoords = [...CANDIDATE_STATION_COORDS];
      }

      const shuffledQ = shuffleArray(QUESTION_BANK);
      selectedCoords.forEach((coord, idx) => {
        questionCheckpoints.push({
          id: `station-${coord.x}-${coord.y}`,
          x: coord.x,
          y: coord.y,
          question: shuffledQ[idx % shuffledQ.length],
          isAnswered: false,
          isCorrect: false,
          scoreAwarded: 0,
        });
      });

      const stationCoordSet = new Set(selectedCoords.map(c => `${c.x},${c.y}`));
      const candidateWalkableCells = [];
      for (let y = 0; y < MAP_HEIGHT; y++) {
        for (let x = 0; x < MAP_WIDTH; x++) {
          const isStart = x === INITIAL_START_POS.x && y === INITIAL_START_POS.y;
          const isGoal = x === INITIAL_GOAL_POS.x && y === INITIAL_GOAL_POS.y;
          const isStation = stationCoordSet.has(`${x},${y}`);
          const isWall = BASE_MAZE_WALLS[y][x] === 1;
          if (!isWall && !isStart && !isGoal && !isStation) {
            candidateWalkableCells.push({ x, y });
          }
        }
      }

      const shuffledSlots = shuffleArray(candidateWalkableCells);
      const diamondCount = Math.min(shuffledSlots.length, 18);
      const selectedDiamonds = shuffledSlots.slice(0, diamondCount);
      selectedDiamonds.forEach((pos, idx) => {
        goldItems.push({
          id: `diamond-${idx}`,
          x: pos.x,
          y: pos.y,
          isCollected: false,
          points: 50,
        });
      });

      return { questionCheckpoints, goldItems };
    }

      status: 'intro', // 'intro' | 'playing' | 'question' | 'completed'
      questionMode: 5,
      score: 0,
      timeElapsed: 0,
      steps: 0,
      highScore: 0,

      questionCheckpoints: [],
      goldItems: [],

      // Player

      targetPos: { x: 1, y: 1 },
      renderPos: { x: 1, y: 1 },
      direction: 'right',
      bumpDirection: null,

      activeCheckpoint: null,
      showHelp: false,
      lockAlert: null,
      unlockCelebration: false,

      // Particles & Canvas internal
      particles: [],
      floatingScores: [],
      shockwaves: [],
      pulse: 0,
      blink: 0,
      timerInterval: null,
      animFrame: null,

      // Prev states for canvas burst triggering
      prevItemsCollected: 0,
      prevQuestionsAnswered: 0,
      prevGoalUnlocked: false,
    };

    // Load Highscore
    try {
      const saved = localStorage.getItem('eduverse_maze_highscore');
      if (saved) gameState.highScore = parseInt(saved, 10) || 0;
    } catch (e) {}

    /* ============================================================= */
    /* 5. CANVAS RENDERING ENGINE                                    */
    /* ============================================================= */
    function startCanvasLoop() {
      const canvas = document.getElementById('maze-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      function renderFrame() {
        if (gameState.status !== 'playing' && gameState.status !== 'question' && gameState.status !== 'completed') {
          return;
        }

        gameState.pulse += 0.05;
        gameState.blink = (gameState.blink + 1) % 180;

        // Smooth lerp robot position
        const lerpSpeed = 0.28;
        gameState.renderPos.x += (gameState.targetPos.x - gameState.renderPos.x) * lerpSpeed;
        gameState.renderPos.y += (gameState.targetPos.y - gameState.renderPos.y) * lerpSpeed;

        const isMoving = Math.hypot(gameState.targetPos.x - gameState.renderPos.x, gameState.targetPos.y - gameState.renderPos.y) > 0.04;

        // Resize Canvas with DevicePixelRatio
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const expectedW = rect.width * dpr;
        const expectedH = rect.height * dpr;
        if (canvas.width !== expectedW || canvas.height !== expectedH) {
          canvas.width = expectedW;
          canvas.height = expectedH;
        }

        ctx.save();
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;
        const cellSize = Math.min(width / MAP_WIDTH, height / MAP_HEIGHT);
        const offsetX = (width - cellSize * MAP_WIDTH) / 2;
        const offsetY = (height - cellSize * MAP_HEIGHT) / 2;

        const isGoalUnlocked = gameState.questionCheckpoints.every(cp => cp.isAnswered);

        // Detect Goal Unlocked Burst
        if (isGoalUnlocked && !gameState.prevGoalUnlocked) {
          const gx = INITIAL_GOAL_POS.x * cellSize + cellSize / 2;
          const gy = INITIAL_GOAL_POS.y * cellSize + cellSize / 2;
          for (let p = 0; p < 24; p++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 4;
            gameState.particles.push({
              x: gx,
              y: gy,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              size: 2.5 + Math.random() * 2.5,
              color: Math.random() > 0.4 ? '#f59e0b' : '#38bdf8',
              alpha: 1,
              decay: 0.02,
            });
          }
          gameState.shockwaves.push({
            x: gx,
            y: gy,
            radius: 6,
            maxRadius: cellSize * 2.2,
            color: '#f59e0b',
            alpha: 1,
            width: 3.5,
          });
          gameState.floatingScores.push({
            text: '★ CỔNG ĐÍCH MỞ!',
            x: gx,
            y: gy - 16,
            vy: -1.0,
            color: '#f59e0b',
            alpha: 1,
          });
        }
        gameState.prevGoalUnlocked = isGoalUnlocked;

        // 1. Draw Space Floor
        ctx.fillStyle = '#060b19';
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(offsetX, offsetY);

        // Draw maze walls & paths
        for (let y = 0; y < MAP_HEIGHT; y++) {
          for (let x = 0; x < MAP_WIDTH; x++) {
            const px = x * cellSize;
            const py = y * cellSize;
            const cell = BASE_MAZE_WALLS[y][x];

            if (cell !== 1) {
              ctx.fillStyle = '#0d1527';
              ctx.fillRect(px, py, cellSize, cellSize);

              ctx.fillStyle = '#1e293b';
              ctx.beginPath();
              ctx.arc(px + cellSize / 2, py + cellSize / 2, 1.2, 0, Math.PI * 2);
              ctx.fill();
            } else {
              drawArcadeWall(ctx, px, py, cellSize, x, y);
            }
          }
        }

        // 2. Start Pad
        const startX = INITIAL_START_POS.x * cellSize;
        const startY = INITIAL_START_POS.y * cellSize;
        ctx.save();
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(startX + 4, startY + 4, cellSize - 8, cellSize - 8);
        ctx.restore();

        // 3. Diamonds (Gold Items)
        gameState.goldItems.forEach(item => {
          if (!item.isCollected) {
            drawGoldItem(ctx, item.x * cellSize + cellSize / 2, item.y * cellSize + cellSize / 2, cellSize, gameState.pulse);
          }
        });

        // 4. Question Portals
        gameState.questionCheckpoints.forEach(cp => {
          drawQuestionPortal(
            ctx,
            cp.x * cellSize + cellSize / 2,
            cp.y * cellSize + cellSize / 2,
            cellSize,
            cp.isAnswered,
            cp.isCorrect || false,
            gameState.pulse
          );
        });

        // 5. Goal / Finish Portal
        drawGoalPortal(
          ctx,
          INITIAL_GOAL_POS.x * cellSize + cellSize / 2,
          INITIAL_GOAL_POS.y * cellSize + cellSize / 2,
          cellSize,
          isGoalUnlocked,
          gameState.pulse
        );

        // Robot screen coords
        let bumpOffsetX = 0;
        let bumpOffsetY = 0;
        if (gameState.bumpDirection) {
          const mag = 5;
          if (gameState.bumpDirection === 'up') bumpOffsetY = -mag;
          if (gameState.bumpDirection === 'down') bumpOffsetY = mag;
          if (gameState.bumpDirection === 'left') bumpOffsetX = -mag;
          if (gameState.bumpDirection === 'right') bumpOffsetX = mag;
        }

        const robotScreenX = gameState.renderPos.x * cellSize + cellSize / 2 + bumpOffsetX;
        const robotScreenY = gameState.renderPos.y * cellSize + cellSize / 2 + bumpOffsetY;

        // Plasma trail
        if (isMoving && Math.random() < 0.7) {
          let exhaustX = robotScreenX;
          let exhaustY = robotScreenY + cellSize * 0.22;
          if (gameState.direction === 'up') exhaustY += 10;
          if (gameState.direction === 'down') exhaustY -= 14;
          if (gameState.direction === 'left') exhaustX += 10;
          if (gameState.direction === 'right') exhaustX -= 10;

          gameState.particles.push({
            x: exhaustX + (Math.random() - 0.5) * 6,
            y: exhaustY + (Math.random() - 0.5) * 4,
            vx: (Math.random() - 0.5) * 0.5,
            vy: 0.5 + Math.random() * 0.8,
            size: 2 + Math.random() * 2,
            color: Math.random() > 0.4 ? 'rgba(56, 189, 248, 0.7)' : 'rgba(129, 140, 248, 0.6)',
            alpha: 0.8,
            decay: 0.05,
          });
        }

        // 6. Cute Robot Vina
        drawRobotVina(
          ctx,
          robotScreenX,
          robotScreenY,
          cellSize,
          gameState.direction,
          gameState.pulse,
          gameState.blink < 8
        );

        // 7. Shockwaves
        for (let i = gameState.shockwaves.length - 1; i >= 0; i--) {
          const sw = gameState.shockwaves[i];
          ctx.save();
          ctx.strokeStyle = sw.color;
          ctx.globalAlpha = Math.max(0, sw.alpha);
          ctx.lineWidth = sw.width;
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          sw.radius += 2.2;
          sw.alpha -= 0.025;
          if (sw.alpha <= 0 || sw.radius >= sw.maxRadius) {
            gameState.shockwaves.splice(i, 1);
          }
        }

        // 8. Particles
        for (let i = gameState.particles.length - 1; i >= 0; i--) {
          const p = gameState.particles[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;
          p.size = Math.max(0.5, p.size * 0.97);
          if (p.alpha <= 0) {
            gameState.particles.splice(i, 1);
          }
        }

        // 9. Floating Scores
        for (let i = gameState.floatingScores.length - 1; i >= 0; i--) {
          const fs = gameState.floatingScores[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, fs.alpha);
          ctx.font = `bold ${Math.round(cellSize * 0.38)}px 'Outfit', sans-serif`;
          ctx.fillStyle = fs.color;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = fs.color;
          ctx.shadowBlur = 8;
          ctx.fillText(fs.text, fs.x, fs.y);
          ctx.restore();

          fs.y += fs.vy;
          fs.alpha -= 0.022;
          if (fs.alpha <= 0) {
            gameState.floatingScores.splice(i, 1);
          }
        }

        ctx.restore();
        ctx.restore();

        gameState.animFrame = requestAnimationFrame(renderFrame);
      }

      if (gameState.animFrame) cancelAnimationFrame(gameState.animFrame);
      gameState.animFrame = requestAnimationFrame(renderFrame);
    }

    // Canvas Helpers
    function drawArcadeWall(ctx, px, py, size, gx, gy) {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(px, py, size, size);

      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 0.5, py + 0.5, size - 1, size - 1);

      const innerPad = size * 0.18;
      const innerSize = size - innerPad * 2;
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(px + innerPad, py + innerPad, innerSize, innerSize);

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.4;
      if ((gx + gy) % 2 === 0) {
        ctx.beginPath();
        ctx.moveTo(px + innerPad + 2, py + innerPad + 2);
        ctx.lineTo(px + size - innerPad - 2, py + size - innerPad - 2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(px + size - innerPad - 2, py + innerPad + 2);
        ctx.lineTo(px + innerPad + 2, py + size - innerPad - 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1.0;
    }

    function drawGoldItem(ctx, cx, cy, size, pulse) {
      const r = size * 0.24;
      const scale = 1 + Math.sin(pulse * 2.4) * 0.05;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);

      const shimmer = (Math.sin(pulse * 3.5) + 1) / 2;
      const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, r * (2.0 + shimmer * 0.4));
      glow.addColorStop(0, `rgba(251, 191, 36, ${0.4 + shimmer * 0.35})`);
      glow.addColorStop(0.6, `rgba(245, 158, 11, ${0.15 + shimmer * 0.15})`);
      glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, r * (2.0 + shimmer * 0.4), 0, Math.PI * 2);
      ctx.fill();

      // Stationary Faceted Diamond
      const topW = r * 0.6;
      const midW = r * 0.95;
      const topY = -r * 0.85;
      const midY = -r * 0.2;
      const botY = r * 0.95;

      ctx.fillStyle = shimmer > 0.6 ? '#fef08a' : '#fde047';
      ctx.beginPath();
      ctx.moveTo(-topW, topY);
      ctx.lineTo(topW, topY);
      ctx.lineTo(midW, midY);
      ctx.lineTo(-midW, midY);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(-midW, midY);
      ctx.lineTo(midW, midY);
      ctx.lineTo(0, botY);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = shimmer > 0.5 ? '#ffffff' : '#fffbeb';
      ctx.beginPath();
      ctx.moveTo(-topW * 0.6, topY + 2);
      ctx.lineTo(topW * 0.6, topY + 2);
      ctx.lineTo(0, midY);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-topW, topY);
      ctx.lineTo(topW, topY);
      ctx.lineTo(midW, midY);
      ctx.lineTo(0, botY);
      ctx.lineTo(-midW, midY);
      ctx.closePath();
      ctx.stroke();

      // Glints
      const sparkle1 = Math.max(0, Math.sin(pulse * 3.8));
      if (sparkle1 > 0.1) {
        const glintSize = 3.2 * sparkle1;
        ctx.save();
        ctx.translate(topW * 0.7, topY + 1);
        ctx.fillStyle = `rgba(255, 255, 255, ${sparkle1})`;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.moveTo(0, -glintSize);
        ctx.lineTo(glintSize * 0.25, -glintSize * 0.25);
        ctx.lineTo(glintSize, 0);
        ctx.lineTo(glintSize * 0.25, glintSize * 0.25);
        ctx.lineTo(0, glintSize);
        ctx.lineTo(-glintSize * 0.25, glintSize * 0.25);
        ctx.lineTo(-glintSize, 0);
        ctx.lineTo(-glintSize * 0.25, -glintSize * 0.25);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }

    function drawQuestionPortal(ctx, cx, cy, size, isAnswered, isCorrect, pulse) {
      const r = size * 0.42;
      const floatY = Math.sin(pulse * 3) * 2.5;

      ctx.save();
      ctx.translate(cx, cy);

      if (isAnswered) {
        if (isCorrect) {
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
          ctx.fill();

          ctx.strokeStyle = '#34d399';
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(-r * 0.35, 0);
          ctx.lineTo(-r * 0.05, r * 0.3);
          ctx.lineTo(r * 0.4, -r * 0.25);
          ctx.stroke();
        } else {
          ctx.strokeStyle = '#f43f5e';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = 'rgba(244, 63, 94, 0.25)';
          ctx.fill();

          ctx.strokeStyle = '#fb7185';
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-r * 0.28, -r * 0.28);
          ctx.lineTo(r * 0.28, r * 0.28);
          ctx.moveTo(r * 0.28, -r * 0.28);
          ctx.lineTo(-r * 0.28, r * 0.28);
          ctx.stroke();
        }
        ctx.restore();
        return;
      }

      // Active Knowledge Cube
      ctx.save();
      ctx.scale(1, 0.55);
      const floorGlow = ctx.createRadialGradient(0, 0, 1, 0, 0, r * 1.6);
      floorGlow.addColorStop(0, 'rgba(56, 189, 248, 0.45)');
      floorGlow.addColorStop(0.7, 'rgba(147, 51, 234, 0.2)');
      floorGlow.addColorStop(1, 'rgba(56, 189, 248, 0)');
      ctx.fillStyle = floorGlow;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.rotate(pulse * 1.2);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.1, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Floating Cyber Cube
      ctx.save();
      ctx.translate(0, floatY - 2);
      const cubeSize = r * 0.55;

      // Top Face
      ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -cubeSize);
      ctx.lineTo(cubeSize * 0.85, -cubeSize * 0.5);
      ctx.lineTo(0, 0);
      ctx.lineTo(-cubeSize * 0.85, -cubeSize * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Left Face
      ctx.fillStyle = 'rgba(129, 140, 248, 0.4)';
      ctx.strokeStyle = '#818cf8';
      ctx.beginPath();
      ctx.moveTo(-cubeSize * 0.85, -cubeSize * 0.5);
      ctx.lineTo(0, 0);
      ctx.lineTo(0, cubeSize * 0.85);
      ctx.lineTo(-cubeSize * 0.85, cubeSize * 0.35);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Right Face
      ctx.fillStyle = 'rgba(168, 85, 247, 0.35)';
      ctx.strokeStyle = '#c084fc';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(cubeSize * 0.85, -cubeSize * 0.5);
      ctx.lineTo(cubeSize * 0.85, cubeSize * 0.35);
      ctx.lineTo(0, cubeSize * 0.85);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Pulsing ?
      const wave = (Math.sin(pulse * 3) + 1) / 2;
      ctx.fillStyle = wave > 0.4 ? '#ffffff' : '#38bdf8';
      ctx.font = `bold ${Math.round(size * 0.38)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 8;
      ctx.fillText('?', 0, -cubeSize * 0.05);
      ctx.shadowBlur = 0;

      ctx.restore();
      ctx.restore();
    }

    function drawGoalPortal(ctx, cx, cy, size, isUnlocked, pulse) {
      const r = size * 0.44;
      ctx.save();
      ctx.translate(cx, cy);

      if (isUnlocked) {
        ctx.save();
        ctx.rotate(pulse * 1.5);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([8, 4]);
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.95, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.rotate(-pulse * 2);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 6]);
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        const coreGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 0.7);
        coreGrad.addColorStop(0, '#ffffff');
        coreGrad.addColorStop(0.3, '#fef08a');
        coreGrad.addColorStop(0.7, '#f59e0b');
        coreGrad.addColorStop(1, '#78350f');
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.round(size * 0.38)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 10;
        ctx.fillText('★', 0, 0);
        ctx.shadowBlur = 0;
      } else {
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        const lockedGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 0.7);
        lockedGrad.addColorStop(0, 'rgba(239, 68, 68, 0.25)');
        lockedGrad.addColorStop(0.7, '#1e293b');
        lockedGrad.addColorStop(1, '#0f172a');
        ctx.fillStyle = lockedGrad;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f87171';
        ctx.font = `bold ${Math.round(size * 0.32)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🔒', 0, -1);
      }

      ctx.restore();
    }

    function drawRobotVina(ctx, cx, cy, cellSize, dir, pulse, isBlinking) {
      const radius = cellSize * 0.36;
      const hoverOffset = Math.sin(pulse * 4) * 1.5;

      ctx.save();
      ctx.translate(cx, cy + hoverOffset);

      // Thruster
      const thrusterGrad = ctx.createRadialGradient(0, radius * 0.8, 1, 0, radius * 0.8, radius * 0.6);
      thrusterGrad.addColorStop(0, 'rgba(56, 189, 248, 0.9)');
      thrusterGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
      ctx.fillStyle = thrusterGrad;
      ctx.beginPath();
      ctx.arc(0, radius * 0.85, radius * 0.6, 0, Math.PI * 2);
      ctx.fill();

      // Antenna
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.7);
      ctx.lineTo(0, -radius * 1.15);
      ctx.stroke();

      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(0, -radius * 1.15, radius * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Body
      const bodyGrad = ctx.createLinearGradient(0, -radius, 0, radius);
      bodyGrad.addColorStop(0, '#ffffff');
      bodyGrad.addColorStop(0.7, '#e2e8f0');
      bodyGrad.addColorStop(1, '#cbd5e1');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, radius * 0.85, radius * 0.95, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // Ears
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.arc(-radius * 0.85, 0, radius * 0.22, 0, Math.PI * 2);
      ctx.arc(radius * 0.85, 0, radius * 0.22, 0, Math.PI * 2);
      ctx.fill();

      // Visor
      ctx.fillStyle = '#090e1f';
      ctx.beginPath();
      const visorW = radius * 1.1;
      const visorH = radius * 0.55;
      const visorY = -radius * 0.18;
      if (ctx.roundRect) {
        ctx.roundRect(-visorW / 2, visorY, visorW, visorH, 6);
      } else {
        ctx.rect(-visorW / 2, visorY, visorW, visorH);
      }
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1;
      ctx.stroke();

      // LED Eyes
      let eyeOffsetX = 0;
      let eyeOffsetY = 0;
      if (dir === 'left') eyeOffsetX = -radius * 0.14;
      if (dir === 'right') eyeOffsetX = radius * 0.14;
      if (dir === 'up') eyeOffsetY = -radius * 0.1;
      if (dir === 'down') eyeOffsetY = radius * 0.1;

      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 4;
      const eyeSpacing = radius * 0.32;
      const eyeCenterY = visorY + visorH / 2 + eyeOffsetY;

      if (isBlinking) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-eyeSpacing - radius * 0.12 + eyeOffsetX, eyeCenterY);
        ctx.lineTo(-eyeSpacing + radius * 0.12 + eyeOffsetX, eyeCenterY);
        ctx.moveTo(eyeSpacing - radius * 0.12 + eyeOffsetX, eyeCenterY);
        ctx.lineTo(eyeSpacing + radius * 0.12 + eyeOffsetX, eyeCenterY);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(-eyeSpacing + eyeOffsetX, eyeCenterY, radius * 0.14, 0, Math.PI * 2);
        ctx.arc(eyeSpacing + eyeOffsetX, eyeCenterY, radius * 0.14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-eyeSpacing + eyeOffsetX + 1, eyeCenterY - 1, radius * 0.05, 0, Math.PI * 2);
        ctx.arc(eyeSpacing + eyeOffsetX + 1, eyeCenterY - 1, radius * 0.05, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // Chest Emblem
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.arc(0, radius * 0.52, radius * 0.13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, radius * 0.52, radius * 0.06, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    /* ============================================================= */
    /* 6. CHARACTER MOVEMENT & COLLISIONS                            */
    /* ============================================================= */
    function moveCharacter(dir) {
      if (gameState.status !== 'playing') return;

      gameState.direction = dir;
      const curr = gameState.playerPos;
      let nextX = curr.x;
      let nextY = curr.y;

      if (dir === 'up') nextY -= 1;
      if (dir === 'down') nextY += 1;
      if (dir === 'left') nextX -= 1;
      if (dir === 'right') nextX += 1;

      // Bounds
      if (nextX < 0 || nextX >= MAP_WIDTH || nextY < 0 || nextY >= MAP_HEIGHT) {
        triggerBump(dir);
        return;
      }

      // Wall collision
      if (BASE_MAZE_WALLS[nextY][nextX] === 1) {
        triggerBump(dir);
        return;
      }

      // Check Question Checkpoint
      const cpIndex = gameState.questionCheckpoints.findIndex(cp => !cp.isAnswered && cp.x === nextX && cp.y === nextY);
      if (cpIndex !== -1) {
        const cp = gameState.questionCheckpoints[cpIndex];
        const newPos = { x: nextX, y: nextY };
        gameState.playerPos = newPos;
        gameState.targetPos = newPos;
        gameState.steps++;
        gameState.activeCheckpoint = cp;
        gameState.status = 'question';
        soundManager.playQuestionPortal();
        renderApp();
        return;
      }

      // Check Goal reached
      if (nextX === INITIAL_GOAL_POS.x && nextY === INITIAL_GOAL_POS.y) {
        const allAnswered = gameState.questionCheckpoints.every(cp => cp.isAnswered);
        if (!allAnswered) {
          triggerBump(dir);
          const remaining = gameState.questionCheckpoints.filter(cp => !cp.isAnswered).length;
          gameState.lockAlert = `🔒 Cổng về đích đang khóa! Bạn cần giải mã thêm ${remaining} câu hỏi tri thức nữa để mở khóa cổng.`;
          renderApp();
          setTimeout(() => {
            if (gameState.lockAlert) {
              gameState.lockAlert = null;
              renderApp();
            }
          }, 3500);
          return;
        }

        // Victory reached
        const newPos = { x: nextX, y: nextY };
        gameState.playerPos = newPos;
        gameState.targetPos = newPos;
        gameState.score += 200; // Finish bonus
        if (gameState.score > gameState.highScore) {
          gameState.highScore = gameState.score;
          try {
            localStorage.setItem('eduverse_maze_highscore', gameState.highScore.toString());
          } catch (e) {}
        }
        gameState.status = 'completed';
        soundManager.playVictory();
        renderApp();
        return;
      }

      // Path move
      const newPos = { x: nextX, y: nextY };
      gameState.playerPos = newPos;
      gameState.targetPos = newPos;
      gameState.steps++;
      soundManager.playStep();

      // Collect diamond
      const diamondIdx = gameState.goldItems.findIndex(i => !i.isCollected && i.x === nextX && i.y === nextY);
      if (diamondIdx !== -1) {
        gameState.goldItems[diamondIdx].isCollected = true;
        gameState.score += 50;
        soundManager.playCollect();

        // Spawn gold sparkles in canvas
        const cellSize = 30; // approx
        const sx = nextX * cellSize + cellSize / 2;
        const sy = nextY * cellSize + cellSize / 2;
        for (let p = 0; p < 10; p++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.2 + Math.random() * 2.5;
          gameState.particles.push({
            x: sx,
            y: sy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 1.5 + Math.random() * 2,
            color: Math.random() > 0.3 ? '#fbbf24' : '#ffffff',
            alpha: 1,
            decay: 0.035,
          });
        }
        gameState.floatingScores.push({
          text: '+50',
          x: sx,
          y: sy - 4,
          vy: -1.2,
          color: '#fbbf24',
          alpha: 1,
        });

        updateHUDStats();
      }
    }

    function triggerBump(dir) {
      soundManager.playBump();
      gameState.bumpDirection = dir;
      setTimeout(() => {
        gameState.bumpDirection = null;
      }, 120);
    }

    // Keyboard listener
    window.addEventListener('keydown', e => {
      if (gameState.status !== 'playing') return;
      let dir = null;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dir = 'up';
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dir = 'down';
      else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dir = 'left';
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dir = 'right';

      if (dir) {
        e.preventDefault();
        moveCharacter(dir);
      }
    });

    async function startGame(mode = 5) {
      await _loadAssignmentQuestions();
      gameState.questionMode = mode;
      const fresh = parseMapEntities(mode);
      gameState.questionCheckpoints = fresh.questionCheckpoints;
      gameState.goldItems = fresh.goldItems;
      gameState.playerPos = { ...INITIAL_START_POS };
      gameState.targetPos = { ...INITIAL_START_POS };
      gameState.renderPos = { ...INITIAL_START_POS };
      gameState.direction = 'right';
      gameState.bumpDirection = null;
      gameState.score = 0;
      gameState.timeElapsed = 0;
      gameState.steps = 0;
      gameState.lockAlert = null;
      gameState.unlockCelebration = false;
      gameState.activeCheckpoint = null;
      gameState.particles = [];
      gameState.floatingScores = [];
      gameState.shockwaves = [];
      gameState.prevGoalUnlocked = false;
      gameState.status = 'playing';

      if (gameState.timerInterval) clearInterval(gameState.timerInterval);
      gameState.timerInterval = setInterval(() => {
        if (gameState.status === 'playing') {
          gameState.timeElapsed++;
          const timerEl = document.getElementById('hud-time');
          if (timerEl) timerEl.textContent = formatTime(gameState.timeElapsed);
        }
      }, 1000);

      soundManager.playCollect();
      renderApp();
      setTimeout(startCanvasLoop, 50);
    }

    function goHome() {
      if (gameState.timerInterval) clearInterval(gameState.timerInterval);
      gameState.status = 'intro';
      gameState.activeCheckpoint = null;
      gameState.lockAlert = null;
      renderApp();
    }

    function resetGame() {
      startGame(gameState.questionMode);
    }

    function toggleMute() {
      gameState.isMuted = !gameState.isMuted;
      soundManager.enabled = !gameState.isMuted;
      renderApp();
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateHUDStats() {
      const scoreEl = document.getElementById('hud-score');
      if (scoreEl) scoreEl.textContent = gameState.score;
      const diamondsEl = document.getElementById('hud-diamonds');
      if (diamondsEl) {
        const collected = gameState.goldItems.filter(i => i.isCollected).length;

        questionsEl.textContent = `${solved}/${gameState.questionCheckpoints.length}`;
      }
    }

                    <div>
                      <div class="font-display" style="font-weight: 800; color: #34d399; font-size: 16px; text-transform: uppercase;">CHÍNH XÁC! XUẤT SẮC!</div>
                      <div style="font-size: 12px; color: #a7f3d0; margin-top: 2px;">Robot Vina đã nạp năng lượng tri thức thành công.</div>
                    </div>
                  </div>
                  <div class="font-mono-numbers" style="background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 13px;">
                    +${q.points} ĐIỂM
                  </div>
                </div>
              ` : `
                <div class="hero-banner incorrect animate-fadeIn">
                  <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="hero-icon-box">
                      <svg class="icon" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    </div>
                    <div>
                      <div class="font-display" style="font-weight: 800; color: #fb7185; font-size: 16px; text-transform: uppercase;">RẤT TIẾC, CHƯA ĐÚNG RỒI!</div>
                      <div style="font-size: 12px; color: #fecdd3; margin-top: 2px;">Đừng nản lòng! Hãy quan sát giải thích bên dưới để ghi nhớ nhé.</div>
                    </div>
                  </div>
                  <div class="font-mono-numbers" style="background: rgba(244, 63, 94, 0.2); border: 1px solid rgba(244, 63, 94, 0.4); color: #fda4af; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 12px;">
                    0 ĐIỂM
                  </div>
                </div>
              `
            ) : ''}

            <!-- Header -->
            <div class="qm-header">
              <div class="qm-title-group">
                <div class="qm-icon-tag">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </div>
                <div>
                  <div class="qm-subtag">Trạm Tri Thức EDUVERSE</div>
                  <div class="qm-subject font-display">${q.subject}</div>
                </div>
              </div>
              ${!isAns ? `
                <div class="qm-points-badge font-mono-numbers">
                  <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
                  <span>+${q.points} điểm</span>
                </div>
              ` : ''}
            </div>

            <!-- Visual diagram -->
            <div class="qm-visual-box">
              ${renderQuestionVisualSVG(q.visualType)}
            </div>

            <!-- Question Prompt -->
            <div class="qm-prompt">${q.question}</div>

            <!-- Options List -->
            <div class="qm-options-list">
              ${q.options.map((opt, idx) => {
                let btnState = '';
                let feedbackTag = '';

                if (isAns) {
                  if (idx === q.correctIndex) {
                    btnState = 'correct';
                    feedbackTag = `<span style="font-weight: 700; font-size: 12px; color: #34d399; display: flex; align-items: center; gap: 4px;">✓ Đáp án đúng</span>`;
                  } else if (idx === questionModalState.selectedIndex) {
                    btnState = 'wrong-chosen';
                    feedbackTag = `<span style="font-weight: 700; font-size: 12px; color: #fb7185; display: flex; align-items: center; gap: 4px;">✕ Bạn đã chọn (Sai)</span>`;
                  } else {
                    btnState = 'dimmed';
                  }
                }

                return `
                  <button
                    class="qm-opt-btn ${btnState}"
                    onclick="handleSelectAnswer(${idx})"
                    ${isAns ? 'disabled' : ''}
                  >
                    <div style="display: flex; align-items: center; gap: 12px;">
                      <span class="qm-opt-label">${optionLabels[idx]}</span>
                      <span>${opt}</span>
                    </div>
                    ${feedbackTag}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Explanation Box -->
            ${isAns ? (
              isCorr ? `
                <div class="qm-expl-box correct animate-fadeIn">
                  <strong style="color: #6ee7b7; display: block; margin-bottom: 4px;">💡 Giải thích chi tiết:</strong>
                  <span style="color: #e2e8f0;">${q.explanation}</span>
                </div>
              ` : `
                <div class="qm-expl-box incorrect animate-fadeIn">
                  <div style="margin-bottom: 8px;">
                    <strong style="color: #fde68a; display: block; margin-bottom: 4px;">💡 Kiến thức cần ghi nhớ:</strong>
                    <span style="color: #e2e8f0;">${q.explanation}</span>
                  </div>
                  <div style="padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;">
                    <span style="color: #fda4af;">Lựa chọn của bạn: ${optionLabels[questionModalState.selectedIndex]}</span>
                    <span style="color: #34d399; font-weight: 700;">Đáp án đúng: ${optionLabels[q.correctIndex]} (${q.options[q.correctIndex]})</span>
                  </div>
                </div>
              `
            ) : ''}

            <!-- Footer Actions -->
            <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between;">
              ${!isAns ? `
                <span style="font-size: 12px; color: #94a3b8; font-style: italic;">Chọn đáp án bạn cho là chính xác nhất</span>
              ` : (
                isCorr ? `
                  <div style="width: 100%; display: flex; justify-content: flex-end;">
                    <button
                      class="btn"
                      style="background: linear-gradient(135deg, #10b981, #0d9488); color: #022c22; font-weight: 800; padding: 10px 22px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);"
                      onclick="closeQuestionModal()"
                    >
                      <span>Tiếp tục khám phá mê cung</span>
                      <svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                  </div>
                ` : `
                  <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                    <button
                      class="btn btn-icon"
                      style="padding: 10px 16px; font-size: 13px; color: #cbd5e1;"
                      onclick="retryQuestionModal()"
                    >
                      <svg class="icon" style="color: #38bdf8;" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                      <span>Thử chọn lại câu này</span>
                    </button>
                    <button
                      class="btn"
                      style="background: linear-gradient(135deg, #e11d48, #ea580c); color: #ffffff; padding: 10px 18px; font-size: 13px; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);"
                      onclick="closeQuestionModal()"
                    >
                      <span>Đã hiểu, tiếp tục đi</span>
                      <svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                  </div>
                `
              )}
            </div>
          </div>
        </div>
      `;
    }

    function handleSelectAnswer(idx) {
      if (questionModalState.isAnswered) return;
      const cp = gameState.activeCheckpoint;
      if (!cp) return;

      const correct = idx === cp.question.correctIndex;
      questionModalState.selectedIndex = idx;
      questionModalState.isAnswered = true;
      questionModalState.isCorrect = correct;

      if (correct) {
        soundManager.playCorrect();
        cp.isAnswered = true;
        cp.isCorrect = true;
        cp.scoreAwarded = cp.question.points;
        gameState.score += cp.question.points;

        // Check if this unlocked the goal
        const allAnswered = gameState.questionCheckpoints.every(c => c.isAnswered);
        if (allAnswered) {
          soundManager.playUnlockGate();
          gameState.unlockCelebration = true;
          setTimeout(() => {
            gameState.unlockCelebration = false;
            renderApp();
          }, 4500);
        }
      } else {
        soundManager.playIncorrect();
        questionModalState.shake = true;
        setTimeout(() => {
          questionModalState.shake = false;
          renderApp();
        }, 500);
        cp.isAnswered = true;
        cp.isCorrect = false;
        cp.scoreAwarded = 0;
      }

      renderApp();
    }

    function retryQuestionModal() {
      questionModalState.selectedIndex = null;
      questionModalState.isAnswered = false;
      questionModalState.isCorrect = false;
      renderApp();
    }

    function closeQuestionModal() {
      questionModalState = {
        selectedIndex: null,
        isAnswered: false,
        isCorrect: false,
        shake: false,
      };
      gameState.activeCheckpoint = null;
      gameState.status = 'playing';
      renderApp();
    }

    function renderVictoryModalHTML(correctCount) {
      let stars = 1;
      const totalQ = gameState.questionCheckpoints.length;
      const itemsCount = gameState.goldItems.filter(i => i.isCollected).length;
      const totalItems = gameState.goldItems.length;

      if (correctCount >= Math.ceil(totalQ * 0.75) && itemsCount >= totalItems * 0.7) {
        stars = 3;
      } else if (correctCount >= 1) {
        stars = 2;
      }

      return `
        <div class="modal-overlay">
          <div class="modal-card" style="max-width: 440px; text-align: center; border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 0 60px rgba(245, 158, 11, 0.25);">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 20px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; margin-bottom: 16px;">
              <svg class="icon" style="width: 32px; height: 32px;" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            </div>

            <h2 class="font-display" style="font-size: 26px; font-weight: 800; color: #ffffff; margin-bottom: 4px;">HOÀN THÀNH MÊ CUNG!</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Robot Vina đã hoàn thành xuất sắc nhiệm vụ giải mã tri thức</p>

            <!-- Star rating -->
            <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
              ${[1, 2, 3].map(s => `
                <div style="padding: 8px; border-radius: 12px; transition: all 0.2s; ${
                  s <= stars
                    ? 'color: #fbbf24; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); transform: scale(1.1);'
                    : 'color: #475569; background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(51, 65, 85, 0.4);'
                }">
                  <svg class="icon" style="width: 30px; height: 30px; fill: currentColor;" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                </div>
              `).join('')}
            </div>

            <!-- Stats Card -->
            <div style="background: rgba(3, 7, 18, 0.6); border-radius: 14px; padding: 14px; border: 1px solid #1e293b; margin-bottom: 20px; text-align: left; display: flex; flex-direction: column; gap: 10px;">
              <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                <span style="color: #94a3b8;">Tổng điểm đạt được:</span>
                <strong class="font-mono-numbers" style="color: #fbbf24; font-size: 18px;">${gameState.score}</strong>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                <span style="color: #94a3b8;">Thời gian hoàn thành:</span>
                <span class="font-mono-numbers" style="color: #e2e8f0; font-weight: 600;">${formatTime(gameState.timeElapsed)}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                <span style="color: #94a3b8;">Câu hỏi trả lời đúng:</span>
                <span class="font-mono-numbers" style="color: #34d399; font-weight: 600;">${correctCount}/${totalQ}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                <span style="color: #94a3b8;">Kim cương thu thập:</span>
                <span class="font-mono-numbers" style="color: #fde68a; font-weight: 600;">${itemsCount}/${totalItems}</span>
              </div>
            </div>

            <!-- Actions -->
            <div style="display: flex; gap: 10px;">
              <button
                class="btn font-display"
                style="flex: 1; padding: 12px; background: linear-gradient(135deg, #f59e0b, #ea580c); color: #020617; font-weight: 800; font-size: 14px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);"
                onclick="resetGame()"
              >
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span>Chơi Lại</span>
              </button>
              <button
                class="btn"
                style="flex: 1; padding: 12px; background: #1e293b; border-color: #334155; color: #e2e8f0; font-weight: 600; font-size: 13px;"
                onclick="goHome()"
              >
                <svg class="icon" style="color: #38bdf8;" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Đổi Chế Độ</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderHelpModalHTML() {
      return `
        <div class="modal-overlay">
          <div class="modal-card" style="max-width: 520px;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
              <h3 class="font-display" style="font-size: 18px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px;">
                <svg class="icon" style="color: #38bdf8;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span>Hướng Dẫn Khám Phá Mê Cung</span>
              </h3>
              <button class="btn btn-icon" style="padding: 6px;" onclick="closeHelp()">
                <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px; font-size: 13px; color: #cbd5e1; line-height: 1.5;">
              <div style="padding: 10px 12px; border-radius: 10px; background: rgba(3, 7, 18, 0.5); border: 1px solid #1e293b;">
                <strong style="color: #ffffff; display: block; margin-bottom: 2px;">Di chuyển Robot Vina:</strong>
                Sử dụng các phím mũi tên <kbd>↑ ↓ ← →</kbd> hoặc <kbd>W A S D</kbd> (hoặc cụm phím D-pad trên điện thoại). Robot không thể đi xuyên qua các bức tường neon.
              </div>

              <div style="padding: 10px 12px; border-radius: 10px; background: rgba(3, 7, 18, 0.5); border: 1px solid #1e293b;">
                <strong style="color: #ffffff; display: block; margin-bottom: 2px;">Thu thập kim cương năng lượng vàng:</strong>
                Mỗi viên kim cương xuất hiện ngẫu nhiên trên đường đi sẽ giúp bạn tích lũy thêm <strong style="color: #fbbf24;">+50 điểm</strong>.
              </div>

              <div style="padding: 10px 12px; border-radius: 10px; background: rgba(3, 7, 18, 0.5); border: 1px solid #1e293b;">
                <strong style="color: #ffffff; display: block; margin-bottom: 2px;">Giải mã Hộp Tri Thức ngẫu nhiên:</strong>
                Chạm vào các khối lập phương phát sáng <span style="font-weight: 700; color: #38bdf8;">[?]</span> để mở câu hỏi trực quan bằng hình vẽ sinh động. Trả lời đúng nhận thêm <strong style="color: #38bdf8;">+100 điểm</strong>!
              </div>

              <div style="padding: 10px 12px; border-radius: 10px; background: rgba(3, 7, 18, 0.5); border: 1px solid #1e293b;">
                <strong style="color: #ffffff; display: block; margin-bottom: 2px;">Cổng về đích:</strong>
                Dẫn lối Robot Vina đến cổng vinh quang ở góc dưới bên phải để hoàn tất mê cung và nhận đánh giá xếp hạng sao!
              </div>
            </div>

            <button
              class="btn"
              style="width: 100%; margin-top: 20px; padding: 12px; background: #0891b2; color: #ffffff; font-weight: 700; font-size: 14px;"
              onclick="closeHelp()"
            >
              Đã hiểu, tiếp tục chơi!
            </button>
          </div>
        </div>
      `;
    }

    function downloadThisGameHTML() {
      const htmlDoc = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([htmlDoc], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'EDUVERSE_Me_Cung_Tri_Thuc_2D.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Initialize App
    renderApp();
  </script>
</body>
</html>
